services:
# MongoDB database

  mongodb:
    image: mirror.gcr.io/library/mongo:8.0
    container_name: alzikrayat-mongodb
    restart: unless-stopped

    volumes:
      - mongo_data:/data/db

    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "db.adminCommand('ping').ok"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Express backend

  server:
    build:
      context: ./server
    image: alzikrayat-server:local
    container_name: alzikrayat-server
    restart: unless-stopped

    environment:
      PORT: 3000
      NODE_ENV: development
      MONGODB_URI: mongodb://mongodb:27017/alzikrayat
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in the root .env file}
      CLIENT_URL: http://localhost:8080

    volumes:
      - uploads_data:/app/uploads

    depends_on:
      mongodb:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # React frontend + Nginx
  
  client:
    build:
      context: ./client
    image: alzikrayat-client:local
    container_name: alzikrayat-client
    restart: unless-stopped

    ports:
      - "8080:80"

    depends_on:
      server:
        condition: service_healthy

# Persistent named volumes

volumes:
  mongo_data:
  uploads_data:
